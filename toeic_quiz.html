let mode='all',order=[],idx=0,score=0,answered=false;const $=x=>document.getElementById(x);let missed=new Set(JSON.parse(localStorage.getItem('toeic_missed')||'[]'));function start(m){mode=m;order=raw.map((_,i)=>i).filter(i=>m==='all'||missed.has(raw[i][0]));idx=0;score=0;render()}function render(){answered=false;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('choices').innerHTML='';if(idx>=order.length){$('question').textContent=order.length?`終了！ ${score} / ${order.length} 問正解`:'間違えた問題はまだありません 🎉';$('count').textContent='完了';$('score').textContent='';$('bar').style.width='100%';return}let q=raw[order[idx]];$('count').textContent=`${idx+1} / ${order.length} 問（No.${q[0]}）`;$('score').textContent=`正解 ${score}`;$('bar').style.width=`${idx/order.length*100}%`;$('question').textContent=q[1];q[2].forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`(${String.fromCharCode(65+i)}) ${v}`;b.onclick=()=>answer(i);$('choices').append(b)})}function answer(i){if(answered)return;answered=true;let q=raw[order[idx]],ok=i===q[3];if(ok){score++;missed.delete(q[0])}else missed.add(q[0]);localStorage.setItem('toeic_missed',JSON.stringify([...missed]));[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('score').textContent=`正解 ${score}`;$('feedback').innerHTML=`<b>${ok?'✅ 正解！':'❌ 不正解'}　正解：(${String.fromCharCode(65+q[3])}) ${q[2][q[3]]}</b><br><br><b>日本語訳</b><br>${q[4]}<br><br><b>解説</b><br>${q[5]}`;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('next').textContent=idx===order.length-1?'結果を見る →':'次の問題 →'}$('next').onclick=()=>{idx++;render()};$('retry').onclick=()=>start('wrong');$('all').onclick=()=>start('all');start('all');</script></html>
