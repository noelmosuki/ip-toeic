const strategyTips={"101": "空欄の直後が名詞 interviews → 名詞の前には所有格 her。she＝主格、hers＝名詞なしで使う所有代名詞、herself＝再帰代名詞を消す。", "102": "空欄の後ろの praise は名詞 → 形容詞 high。highly は副詞、higher は比較級（比較対象なし）、highness は名詞なので消去。", "103": "responsible を見たら responsible for ～ing のセット。from / over / of はこの定型表現にならない。", "104": "have not confirmed は「まだ確認していない」→ still が自然。ever＝今までに、soon＝まもなく、nearly＝ほぼ、は文脈と合わない。", "105": "空欄の後ろに his paintings were exhibited（主語＋動詞）がある → 節をつなげる after。about は前置詞、instead は単独では接続詞にならず、only も時間関係を示せない。", "106": "主語 All providers のあとに動詞が必要。4つとも動詞になり得るので意味で絞る。use は「利用する」＋目的語 portal。reply は通常 reply to、tell は相手が必要、put は置く場所などが必要。", "107": "所有格 International’s と design の後ろに中心となる名詞が必要 → competition。compete は動詞、competed / competing は動詞の形で、ここでは大会名にならない。", "108": "後ろに metropolitan and rural と A and B の並列がある → both A and B。either は通常 either A or B、also と and はこの形を作れない。", "109": "a coworker of ～「～の同僚の一人」→ of の後に単独で使える所有代名詞 mine。my は後ろに名詞が必要、I は主格、me ではこの所有関係を表せない。", "110": "determine の後ろが ------- to advertise → 疑問詞＋to不定詞「どう～するか」＝how to advertise。like / so / ever はこの構文にならない。", "111": "to の直後は動詞の原形 → finance / collaborate / invest / resolve は全部動詞なので消去できない。直後に their own businesses（目的語）があり finance a business「事業資金を調達する」が自然。invest は通常 invest in、collaborate は with。", "112": "that の前は単数の vehicle、後ろは recycled materials → that 節の動詞が必要。単数現在形 transports。transportation / transporter は名詞、transport は三単現の s がない。", "113": "空欄の後ろが金額 $24.5 million → 「約」を意味する副詞 approximately。approximate は形容詞/動詞、approximation は名詞、approximates は動詞。", "114": "空欄＋diagram は形容詞＋名詞の形。4択とも修飾に使える場合があるので意味で選ぶ。「部品の詳しい図」＝detailed diagram。他はこの文脈に合わない。", "115": "reviews の前は動詞を修飾する副詞。全部 -ly なので形だけでは決まらない。monthly meetings がヒント → regularly「定期的に」。previously は「以前に」。", "116": "the areas ------- Rivertown が主語のまとまり。後ろに will not be affected という本動詞がある → 空欄には修飾語。surrounding Rivertown「町を囲む」が正解。surround / surrounds は動詞が重複し、surrounded は通常 by が必要。", "117": "------- to the front entrance が文の主語。Access to ～「～への立ち入り」の熟語を選ぶ。Direction / Placement / Solution では blocked（遮断される）と意味がつながりにくい。", "118": "the ------- that ～ で the の後に名詞が必要。possible＝形容詞、possibly＝副詞を消す。possibilities は複数形なので the possibilities that も文脈次第ではあり得るが、ここでは一つの閉鎖の可能性 → possibility。", "119": "will の直後は動詞の原形 → 全選択肢とも原形なので意味で判定。割引がキャンペーンに応じて「変わる」→ change。calculate / include / expect は目的語が必要な使い方になりやすい。", "120": "approved ------- the wishes「意向に反して承認」→ against。except は通常 except for、behind＝背後、inside＝内側、では意味が合わない。", "121": "文の主語 Attendance の後に述語動詞が必要 → 過去形 surpassed。surpassing / having surpassed は分詞、to surpass は不定詞で、単独では述語動詞になれない。", "122": "空欄の後ろに the delivery arrives（主語＋動詞）→ 接続詞句が必要。As soon as「～するとすぐに」。Other than / In addition to は後ろに名詞などを取る前置詞句。So that は目的を表すので意味が違う。", "123": "a day ------- the general public「一般の人より1日早く」→ ahead of。between は2者の間、during は期間中、away from は離れて、で時間の先行を示さない。", "124": "financial ------- の後ろに for outstanding performance → 名詞が必要。全選択肢が名詞なので意味勝負。financial incentive for performance「成果に対する金銭的報奨」。", "125": "provide you with ------- で「代わりの1枚」を指す → another（単独で代名詞として使える）。other は通常後ろに名詞、other one は冠詞などが必要、one another は「お互い」。なお If の後が必ず動詞の原形になるわけではない。ここは you misplace と現在形。", "126": "------- orders は形容詞＋名詞。4択とも修飾語になり得るため意味で判断。updates on pending orders「処理待ちの注文の進捗」。dependent / considered / practical は不自然。", "127": "The ------- of ～ relative to Airport → 名詞が必要。すべて名詞なので意味を確認。「空港への近さ」＝proximity。majority＝大多数、display＝展示、temperature＝温度。", "128": "------- clinics はクリニックを修飾する語が必要 → affiliated「提携している」。affiliates / affiliation / affiliations は名詞で、この文脈の「提携クリニック」を自然に表さない。", "129": "空欄の後ろが how old they are（疑問詞節）→ regardless of how old ～「どんなに古くても」。aside from＝～を除いて、instead of＝～の代わりに、prior to＝～より前に、は意味が合わない。", "130": "It is ------- that ～ の形で形容詞が必要。全部形容詞なので意味で選ぶ。情報保護のため「不可欠」→ imperative。persuasive＝説得力のある、authoritative＝権威ある、disruptive＝破壊的な。"};

let favorites={grammar:new Set(JSON.parse(localStorage.getItem('toeic_fav_grammar')||'[]')),vocab:new Set(JSON.parse(localStorage.getItem('toeic_fav_vocab')||'[]'))};function favId(i){return section==='grammar'?raw[i][0]:i}function refreshStar(){let el=$('star');if(idx>=order.length){el.classList.add('hidden');return}el.classList.remove('hidden');let on=favorites[section].has(favId(order[idx]));el.textContent=on?'⭐':'☆';el.classList.toggle('on',on);el.setAttribute('aria-label',on?'お気に入りを解除':'お気に入りに登録')}let mode='all',order=[],idx=0,score=0,answered=false,section='grammar',vocabOptions=[];const $=x=>document.getElementById(x);let missed=new Set(JSON.parse(localStorage.getItem('toeic_missed')||'[]'));let vocabMissed=new Set(JSON.parse(localStorage.getItem('toeic_vocab_missed')||'[]'));function start(m){mode=m;order=(section==='grammar'?raw:vocab).map((_,i)=>i).filter(i=>m==='all'||(m==='favorites'?favorites[section].has(favId(i)):(section==='grammar'?missed.has(raw[i][0]):vocabMissed.has(i))));if(section==='vocab')order.sort(()=>Math.random()-.5);idx=0;score=0;render()}function render(){answered=false;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('choices').innerHTML='';refreshStar();if(idx>=order.length){$('question').textContent=order.length?`終了！ ${score} / ${order.length} 問正解`:(mode==='favorites'?'⭐ お気に入りはまだありません。問題の☆をタップして登録しよう！':'間違えた問題はまだありません 🎉');$('count').textContent='完了';$('score').textContent='';$('bar').style.width='100%';return}if(section==='vocab'){renderVocab();return}let q=raw[order[idx]];$('count').textContent=`${idx+1} / ${order.length} 問（No.${q[0]}）`;$('score').textContent=`正解 ${score}`;$('bar').style.width=`${idx/order.length*100}%`;$('question').textContent=q[1];q[2].forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`(${String.fromCharCode(65+i)}) ${v}`;b.onclick=()=>answer(i);$('choices').append(b)})}function answer(i){if(section==='vocab'){answerVocab(i);return}if(answered)retur function renderVocab(){let n=order[idx],q=vocab[n],distractors=vocab.map((x,i)=>i).filter(i=>i!==n).sort(()=>Math.random()-.5).slice(0,3);vocabOptions=[n,...distractors].sort(()=>Math.random()-.5);$('count').textContent=`${idx+1} / ${order.length} 語`;$('score').textContent=`正解 ${score}`;$('bar').style.width=`${idx/order.length*100}%`;$('question').textContent=q[0];vocabOptions.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`(${String.fromCharCode(65+i)}) ${vocab[v][1]}`;b.onclick=()=>answerVocab(i);$('choices').append(b)})}
