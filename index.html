const strategyTips={"101": "【正解 B：her】A she：主格「彼女は」で、名詞 interviews の前には置けない。／B her：所有格「彼女の」で、名詞 interviews を説明できる。／C hers：所有代名詞「彼女のもの」で、後ろに名詞を置かない。／D herself：再帰代名詞「彼女自身」で、ここでは意味・形が合わない。", "102": "【正解 C：high】A higher：比較級「より高い」だが、比べる相手が示されていない。／B highly：副詞「非常に」で、名詞 praise を直接説明できない。／C high：形容詞「高い」で、名詞 praise を説明できる。／D highness：名詞「高さ・高位」で、名詞 praise の前に置く形ではない。", "103": "【正解 D：for】A from：「～から」で、responsible from とは言わない。／B over：「～の上に・～を超えて」で、責任を表す形にならない。／C of：「～の」で、responsible of とは言わない。／D for：be responsible for ～「～に責任がある」という決まった形。", "104": "【正解 A：still】A still：「いまだに」で、何度も通知されたのに確認していない状況に合う。／B ever：「今までに」で、経験を尋ねる疑問文などでよく使う。／C soon：「まもなく」で、まだ確認していない状態を表せない。／D nearly：「ほとんど」で、confirm のような動作の未完了を表す語として不自然。", "105": "【正解 B：after】A about：「～について」で、後ろに主語＋動詞の文をそのまま続けられない。／B after：「～した後に」で、後ろの his paintings were exhibited という文をつなげられる。／C instead：「その代わりに」で、単独ではこの位置で文をつなぐ接続詞にならない。／D only：「ただ～だけ」で、時間の前後関係を作れない。", "106": "【正解 C：use】A put：「置く」で、何をどこに置くかという情報が足りない。／B reply：「返信する」で、通常は reply to ～ の形にする。／C use：「利用する」で、目的語 an online portal と自然につながる。／D tell：「伝える」で、tell 人 内容のように伝える相手が必要。", "107": "【正解 B：competition】A compete：動詞「競争する」で、design の後ろに置く大会名の名詞にならない。／B competition：名詞「競技会・コンテスト」で、design competition「デザインコンテスト」となる。／C competed：動詞の過去形・過去分詞で、名詞の位置に置けない。／D competing：動詞のing形で、ここでは大会名を表す名詞にならない。", "108": "【正解 A：both】A both：「両方」で、both A and B「AとBの両方」という形を作れる。／B also：「～もまた」で、both A and B の形にはならない。／C and：「そして」で、and の前に置いて両方を示す語がない。／D either：「どちらか」で、通常 either A or B と組み合わせるため and とは合わない。", "109": "【正解 D：mine】A my：「私の」で、後ろに名詞が必要。ここでは of の直後なので置けない。／B I：「私は」で、主格なので前置詞 of の後ろに置けない。／C me：「私を・私に」で、目的格だが「私の同僚の一人」という所有関係を表せない。／D mine：「私のもの」で、a coworker of mine「私の同僚の一人」という決まった形。", "110": "【正解 D：how】A like：「好き」などの意味で、how to advertise「どう宣伝するか」の形にならない。／B so：「とても・だから」で、to advertise の前に置いて方法を尋ねられない。／C ever：「今までに」で、疑問詞＋to不定詞の形を作れない。／D how：「どのように」で、how to advertise「どう宣伝するか」となる。", "111": "【正解 A：finance】A finance：「資金を調達する」で、their own businesses を目的語にできる。／B collaborate：「協力する」で、通常 collaborate with ～ の形。／C invest：「投資する」で、通常 invest in ～ の形にする。／D resolve：「解決する」で、businesses を解決するという意味になり文脈に合わない。", "112": "【正解 B：transports】A transportation：名詞「輸送」で、that の後ろに必要な動詞にならない。／B transports：動詞「輸送する」の三人称単数形。先行詞 vehicle が単数なので正解。／C transport：動詞の原形で、主語 vehicle に合わせると transports が必要。／D transporter：名詞「輸送機・運搬人」で、ここでは動詞にならない。", "113": "【正解 D：approximately】A approximates：動詞「およそ～である・近似する」で、for の後ろに置く形ではない。／B approximation：名詞「概算・近似」で、金額を説明する副詞にならない。／C approximate：形容詞「おおよその」で、ここでは金額の前に副詞が必要。／D approximately：「約」で、金額 $24.5 million を説明できる。", "114": "【正解 B：detailed】A reported：「報告された」で、diagram（図）が報告されたという意味になり不自然。／B detailed：「詳細な」で、部品の詳しい図という意味になる。／C listed：「列挙された」で、部品の図を説明する語として不自然。／D contained：「含まれた」で、diagram の前から説明する形として合わない。", "115": "【正解 C：regularly】A singularly：「並外れて・単独で」で、毎月の会議で繰り返し審査する意味にならない。／B previously：「以前に」で、毎月の会議で定期的に行うことを表せない。／C regularly：「定期的に」で、monthly meetings「月例会議」と意味がつながる。／D brightly：「明るく」で、reviews（審査する）という動作の頻度を表せない。", "116": "【正解 C：surrounding】A surround：動詞の原形で、後ろに本動詞 will not be affected があるため、ここにそのまま置くと動詞が重なる。／B surrounds：三人称単数の動詞で、同じく本動詞と重なる。／C surrounding：「取り囲んでいる」で、areas を説明する現在分詞。／D surrounded：過去分詞で、通常 surrounded by ～「～に囲まれた」の形にする。", "117": "【正解 B：Access】A Direction：「方向」で、入口への方向が blocked という意味になり不自然。／B Access：「立ち入り・利用」で、access to the entrance「入口への立ち入り」が一時的に blocked（制限）される。／C Placement：「配置」で、入口への配置が blocked とは言わない。／D Solution：「解決策」で、入口への解決策という意味にならない。", "118": "【正解 D：possibility】A possible：形容詞「可能な」で、the の後ろに置く名詞が必要。／B possibilities：複数名詞「可能性」で、複数の可能性を指すなら使えるが、ここでは閉鎖という一つの可能性を述べている。／C possibly：副詞「おそらく」で、the の後ろの名詞にならない。／D possibility：名詞「可能性」で、the possibility that ～「～という可能性」となる。", "119": "【正解 C：change】A calculate：「計算する」で、割引そのものがキャンペーンに基づいて計算されるというより、内容が変わるという文脈。／B include：「含む」で、割引がキャンペーンに応じて含む、とは意味がつながらない。／C change：「変わる」で、割引内容がキャンペーンに応じて変化する。／D expect：「予想する」で、discounts を主語にすると「割引が予想する」となり意味が合わない。", "120": "【正解 C：against】A except：「～を除いて」で、the wishes と組み合わせても「意向に反して」にならない。／B behind：「～の後ろに」で、意向の背後という意味になり不自然。／C against：「～に反して」で、against the wishes of ～「～の意向に反して」という決まった表現。／D inside：「～の内側に」で、意向に対して使う前置詞ではない。", "121": "【正解 C：surpassed】A surpassing は「上回っている」という -ing形。分詞として名詞を説明したり、進行形の一部になったりする形で、単独では文のメイン動詞になれない。／B to surpass は「上回ること／上回るために」という to不定詞。目的などを表す形で、主語の後ろのメイン動詞にはならない。／C surpassed は過去形。「出席者数が期待を上回った」と文を完成させるので正解。／D having surpassed は「すでに上回っていて」という完了分詞。例：Having surpassed expectations, attendance increased. のように、別のメイン動詞に情報を付け足す形。ここではメイン動詞が必要なのでダメ。", "122": "【正解 A：As soon as】A As soon as は「〜するとすぐに」。後ろに主語＋動詞を置いて、到着した直後に作業を始める、という時間の順番を表せるので正解。／B Other than は「〜以外」。例：other than Monday（月曜日以外）。時間の「〜したらすぐ」には使えない。／C In addition to は「〜に加えて」。例：in addition to vegetables（野菜に加えて）。前置詞なので後ろは名詞・動名詞などが基本で、ここにある主語＋動詞の文をそのまま続けられない。／D So that は「〜するために／〜となるように」。後ろに主語＋動詞は置けるが、目的を表す表現。今回は「配達が到着したらすぐに」という時間の意味なので合わない。", "123": "【正解 D：ahead of】A between は「〜と〜の間」。例：between Monday and Friday（月曜と金曜の間）。基本的に比べる対象を2つ示す表現で、the general public の前に置いて「一般の人より早く」とは言えない。／B during は「〜の期間中」。例：during the meeting（会議中）。後ろには期間・出来事を表す名詞が来るが、「一般の人々の期間中」では意味が通らない。／C away from は「〜から離れて」。例：away from the airport（空港から離れて）。場所の距離を表すので、公開時期の早さには使えない。／D ahead of は「〜より先に／〜より早く」。例：ahead of schedule（予定より早く）。一般公開より1日早く読める、となるので正解。", "124": "【正解 C：incentive】A respect は「尊敬」。よく使う形は show respect for ～（〜に敬意を示す）。成果への金銭的なご褒美という意味ではないのでダメ。／B default は「不履行・債務不履行」や「初期設定」。例：default on a loan（ローンを返済できない）。financial default は財務上の債務不履行で、報奨ではない。／C incentive は「やる気を起こさせる報奨・動機」。financial incentive for outstanding performance で「優れた成果に対する金銭的報奨」となるので正解。／D omission は「省略・抜け」。よく使う形は omission of information（情報の省略）。成果に対する報奨という意味にはならないのでダメ。", "125": "【正解 A：another】A another は「もう1つ／別の1つ」。another pass のように名詞の前にも置けるし、another だけで「もう1枚」と代名詞としても使える。今回は provide you with another（もう1枚渡す）なので正解。／B other one は、この形だけでは不自然。特定のもう一方なら the other one、別の1つなら another one とする。／C one another は「お互いに」。例：They help one another.（彼らは助け合う）。人や物同士の相互関係を表すので、代わりの駐車券には使えない。／D other は「ほかの」という意味で、基本は other + 名詞（other passes）の形。単数の1枚を指して単独で置くなら another や the other が必要なのでダメ。", "126": "【正解 B：pending】A dependent は「依存している」。よく使う形は be dependent on ～（〜に依存している）。dependent orders だと「何かに依存した注文」となり、処理待ちの意味ではない。／B pending は「未処理の・保留中の」。pending orders は「処理待ちの注文」。注文の進捗を知らせる、という文脈にぴったりなので正解。／C considered は「検討された」。例：be considered for the position（その職の候補として検討される）。「検討済みの注文」となり、まだ処理待ちという意味とは違う。／D practical は「実用的な」。例：a practical solution（実用的な解決策）。注文が実用的という意味になり、処理状況を表せないのでダメ。", "127": "【正解 B：proximity】A majority は「大多数」。よく使う形は the majority of + 複数名詞（〜の大多数）。例：the majority of customers（顧客の大多数）。ホテルの空港への近さは表せない。／B proximity は「近さ」。proximity to ～ で「〜に近いこと」。the proximity of the hotel to the airport なら「ホテルが空港に近いこと」なので正解。／C display は「展示・表示」。よく使う形は display of ～（〜の展示）や display something（〜を展示する）。場所の近さとは関係ない。／D temperature は「温度」。例：the temperature of the room（部屋の温度）。空港との距離を表す言葉ではないのでダメ。", "128": "【正解 A：affiliated】A affiliated は「提携した・系列の」という形容詞。be affiliated with ～（〜と提携している）という形でも使う。affiliated clinics で「提携クリニック」と名詞 clinics を説明できるので正解。／B affiliates は「関連会社・提携先」という名詞。例：overseas affiliates（海外の関連会社）。名詞なので、ここで clinics の前に置いて「提携しているクリニック」と説明する形にはならない。／C affiliation は「提携・所属」という名詞。例：affiliation with a university（大学との提携）。名詞 clinics を直接説明する形にはならない。／D affiliations は affiliation の複数形で「提携関係・所属関係」。例：professional affiliations（職業上の所属・関係）。これも名詞なので、affiliations clinics とはつなげられない。", "129": "【正解 B：regardless of】A aside from は「〜を除いて／〜は別として」。例：aside from the cost（費用は別として）。後ろに名詞や動名詞を置くのが基本で、ここで「請求書の古さを除いて保存する」では意味が合わない。／B regardless of は「〜に関係なく」。regardless of how old they are で「どれだけ古くても」。年齢に左右されず、すべての請求書を保存する意味なので正解。／C instead of は「〜の代わりに」。例：instead of driving（車を運転する代わりに）。後ろに名詞・動名詞などを置く表現で、「古さの代わりに保存する」では意味が通らない。／D prior to は「〜より前に」。例：prior to the meeting（会議の前に）。後ろには名詞・動名詞を置くのが基本で、how old they are という主語＋動詞を含む節をそのまま続けられない。意味も「古さより前に」になってしまうのでダメ。", "130": "【正解 C：imperative】A persuasive は「説得力のある」。よく使う形は a persuasive argument（説得力のある主張）や a persuasive speaker（説得力のある話し手）。サーバーが安全であることを「説得力がある」とは言わないのでダメ。／B authoritative は「権威のある・信頼できる」。例：an authoritative source（権威ある情報源）。人・情報源・意見などの信頼性や権威を表す語で、ここで必要な「絶対に必要」という意味ではない。／C imperative は「絶対に必要な・不可欠な」。It is imperative that ～ で「〜することが絶対に必要だ」。顧客情報を守るためにサーバーの安全性が不可欠、という意味で正解。／D disruptive は「混乱を引き起こす・妨げになる」。例：disruptive behavior（周囲を乱す行動）や disruptive technology（既存の仕組みを大きく変える技術）。安全性が必要だという文脈に合わないのでダメ。",
"131":"【正解 A：encouraged】A encouraged は「促した」。encourage 人 to do（人に〜するよう促す）という形で使う。encouraged city council members to approve（議員に承認するよう促した）なので正解。／B suggested は「提案した」。suggest doing（〜することを提案する）または suggest that 主語＋動詞の形。suggest 人 to do とは通常言わないので、後ろの形が合わない。／C argued は「主張した」。argue that 主語＋動詞（〜だと主張する）や argue with 人（人と言い争う）の形で使う。argued 人 to do とは言わない。／D reported は「報告した」。report that 主語＋動詞（〜だと報告する）や report something to 人（人に〜を報告する）の形。report 人 to do とは言わない。",
"132":"【正解 B：efforts】A effortless は「努力を必要としない・楽な」という形容詞。例：an effortless task（楽にできる仕事）。company's の後ろに置く名詞が必要なので形が違う。／B efforts は effort（努力・取り組み）の複数形の名詞。the company's efforts to achieve its goals（目標達成に向けた会社の取り組み）となるので正解。／C effortful は「努力を要する」という形容詞。例：an effortful process（努力を要する過程）。ここでは名詞が必要なのでダメ。／D effortlessly は「苦労せずに」という副詞。例：work effortlessly（苦労せずに働く）。名詞 company's の直後に置いて「会社の取り組み」とは言えない。",
"133":"【正解 B：expertly】A extremely は「極めて・非常に」。例：extremely difficult（非常に難しい）のように形容詞や副詞の程度を強める。mixed（混ぜた）という動作のやり方を表すには合わない。／B expertly は「熟練した手つきで」。例：expertly prepared（熟練して調理された）。mixed を「どのように混ぜたか」を説明するので正解。／C tightly は「きつく・しっかりと」。例：hold tightly（しっかり握る）。混ぜ方を表す場合もあるが、この文の「スパイスを混ぜる」では熟練した手つきを表す expertly が自然。／D finely は「細かく・微細に」。例：finely chopped onions（細かく刻んだ玉ねぎ）。切る・刻む粒の細かさを表すことが多く、spices を混ぜる技術を表すこの文脈には合わない。",
"134":"【正解 D：formal】A formalize は「正式なものにする」という動詞。例：formalize an agreement（合意を正式なものにする）。request の前に置く形容詞が必要なのでダメ。／B formally は「正式に」という副詞。例：formally announce（正式に発表する）。名詞 request を前から説明する位置には置けない。／C formality は「形式・形式的な手続き」という名詞。例：a formality（形式的な手続き）。ここでは request の種類を説明する形容詞が必要なのでダメ。／D formal は「正式な」という形容詞。formal request（正式な申請）となり、名詞 request を説明するので正解。",
"135":"【正解 B：numerous】A faithful は「忠実な」。例：a faithful employee（忠実な従業員）。人や再現などに使う語で、問題の数が多いことは表せない。／B numerous は「数多くの」。numerous issues（数多くの問題）という自然な組み合わせで正解。／C classical は「古典的な」。例：classical music（クラシック音楽）。問題の数を表す語ではない。／D rapid は「速い・急速な」。例：rapid growth（急速な成長）。通常は成長や変化の速さを表し、issues の数が多いという意味にはならない。",
"136":"【正解 C：forwarded】A forward は「転送する」という動詞の原形。例：Please forward this mail.（この郵便を転送してください）。今回は be の後ろなので、受動態を作る過去分詞が必要。／B forwards は forward の三人称単数形（he forwards）。主語が郵便物で、しかも be の後ろに置く形ではないのでダメ。／C forwarded は過去分詞。「郵便物が転送される」という be forwarded の受動態になるので正解。／D forwarding は -ing形。例：forwarding an e-mail（メールを転送すること）。be forwarding なら「転送している」という進行形になるが、この文の be forwarded「転送される」とは形・意味が違う。",
"137":"【正解 C：throughout】A into は「〜の中へ」。例：go into the building（建物の中に入る）。中へ向かう動きを表すので、建物全体で交換する意味にはならない。／B to は「〜へ」。例：go to the office（オフィスへ行く）。方向・到達点を表し、作業範囲の「全体にわたって」ではない。／C throughout は「〜の至る所で／全体にわたって」。throughout the building で「建物全体で」となるので正解。／D among は「〜の間に」。例：among the employees（従業員たちの間で）。複数の人・物の間を表し、建物全体という範囲には使わない。",
"138":"【正解 A：reasonably】A reasonably は「かなり・適度に」。副詞なので形容詞 high の程度を説明できる。reasonably high（かなり高い）となるので正解。／B reasonable は「妥当な」という形容詞。例：a reasonable price（妥当な価格）。形容詞 high を修飾するには副詞が必要なのでダメ。／C reasons は「理由」という名詞 reason の複数形。例：many reasons（多くの理由）。給与がどの程度高いかを説明できない。／D reasoned は「筋道立てた」という形容詞・過去分詞。例：a reasoned argument（筋道立った議論）。high の程度を表す副詞ではないのでダメ。",
"139":"【正解 D：agreement】A reference は「参照・推薦状・言及」。例：a reference letter（推薦状）。sign a reference だと「推薦状に署名する」など別の意味になり、働き始めるために署名する標準契約書ではない。／B advice は「助言」。例：give advice（助言する）。通常は不可算名詞で、sign advice（助言に署名する）とは言わない。／C format は「形式・書式」。例：file format（ファイル形式）。書類の形式そのものに署名するのではなく、契約に署名する文脈なのでダメ。／D agreement は「合意・契約」。sign an agreement（契約に署名する）は自然な組み合わせで、仕事を始める前に標準契約に署名する意味なので正解。",
"140":"【正解 B：their】A them は「彼らを／彼らに」という目的格。例：contact them（彼らに連絡する）。名詞 headquarters の前に置いて「彼らの本社」とは言えない。／B their は「彼らの／それらの」という所有格。their headquarters（彼らの本社）となり、後ろの名詞 headquarters を説明するので正解。／C themselves は「彼ら自身」という再帰代名詞。例：They introduced themselves（彼らは自己紹介した）。「彼ら自身の本社」という意味を作るには通常 their own headquarters とするので、この位置には合わない。／D theirs は「彼らのもの」という所有代名詞。例：This office is theirs（このオフィスは彼らのもの）。後ろに名詞を続けない形なので、直後に headquarters があるこの文では使えない。",
"141":"【正解 C：specified】A positioned は「位置を定めた・配置した」。例：position a chair near the door（椅子をドアの近くに置く）。物の位置を決める語で、日程を明示する意味ではない。／B perfected は「完璧にした」。例：perfect a technique（技術を完成させる）。日付を完璧にする、とは言わない。／C specified は「明確に指定した」。specify a date（日時を指定する）、be specified（指定される）。has not been specified で「まだ日程が指定されていない」となるので正解。／D amplified は「増幅した・強めた」。例：amplify a sound（音を大きくする）。音や影響などを強める語で、日付を決める意味ではない。",
"142":"【正解 B：rate】A period は「期間」。例：a period of three months（3か月の期間）。時間の長さを表す語で、毎分100枚という処理速度には使わない。／B rate は「割合・速度」。at a rate of ～ で「〜の速度で」。at a rate of 100 sheets per minute（毎分100枚の速度で）となるので正解。／C distance は「距離」。例：the distance between two cities（2つの都市の距離）。長さ・隔たりを表し、1分あたりの処理枚数には使わない。／D page は「ページ」。例：the first page（最初のページ）。紙のページそのものを指す名詞で、速度を表す at a rate of の代わりにはならない。",
"143":"【正解 A：understandably】A understandably は「もっともなことに・理解できることに」という副詞。形容詞 reluctant（気が進まない）を説明し、「そう感じるのももっともだ」となるので正解。／B understandable は「理解できる」という形容詞。例：an understandable mistake（理解できる間違い）。形容詞 reluctant を修飾する位置には副詞が必要なのでダメ。／C understanding は「理解」や「理解のある」という意味。例：a mutual understanding（相互理解）、an understanding person（理解のある人）。この文では reluctant の程度・理由を説明する副詞として使えない。／D understood は「理解された」という過去形・過去分詞。例：I understood the question（質問を理解した）。ここでは「理解された消極的な」では文意が通らず、形も合わない。",
"144":"【正解 D：Each】A Certain は「ある特定の」。例：a certain customer（ある特定のお客様）。単数名詞の前では通常 a certain customer と冠詞 a が必要で、Certain customer の形では使えない。／B All は「すべての」。例：all customers（すべてのお客様）。all の後ろは基本的に複数名詞なので、単数の customer とは合わない。／C Few は「ほとんどいない・少数の」。例：few customers（少数のお客様）。後ろは複数名詞になるため、単数 customer とは合わない。／D Each は「それぞれの・一人ひとりの」。each customer のように単数名詞を続ける。お客様一人ひとりにプレゼントが渡る意味なので正解。",
"145":"【正解 B：protection】A protect は「守る」という動詞。例：protect customers（顧客を守る）。extra の後ろには名詞が必要なので、動詞のままでは置けない。／B protection は「保護・防護」という名詞。extra protection against cold weather（寒さに対する追加の防護）となるので正解。／C protector は「保護する人・物」。例：screen protector（画面保護フィルム）。人や道具を指す名詞で、extra protector against cold weather では「追加の保護具」という別の意味になり、この文の「防寒性・保護」には protection が自然。／D protected は「守られた」という過去分詞・形容詞。例：a protected area（保護区域）。名詞 extra の後ろに置いて「追加の保護」という意味を作れない。",
"146":"【正解 D：encountered】A concluded は「結論づけた・終えた」。例：conclude a meeting（会議を終える）、conclude that ～（〜だと結論づける）。問題に直面する意味ではない。／B accomplished は「成し遂げた」。例：accomplish a goal（目標を達成する）。minor issues（小さな問題）を成し遂げた、とは言わない。／C earned は「得た・稼いだ」。例：earn money（お金を稼ぐ）、earn respect（尊敬を得る）。問題に遭遇したという意味にはならない。／D encountered は「遭遇した・直面した」。encounter a problem / issue（問題に直面する）という組み合わせ。初期段階で小さな問題に直面した、という意味で正解。",
"147":"【正解 A：instead of】A instead of は「〜の代わりに」。後ろに名詞または動名詞（-ing）を置く。instead of spending the extra money（余分なお金を使う代わりに）となるので正解。／B paid for は「〜の代金を支払った／支払われた」。例：paid for the meal（食事代を支払った）。後ろに spending を続けて「使う代わりに」という意味にはならない。／C apart from は「〜を除いて／〜に加えて」。例：apart from the cost（費用を除けば）。後ろに名詞などを置くが、「余分なお金を使うことを除いて再投資する」では文意が違う。／D offers to は「〜することを申し出る」。offer to do（〜することを申し出る）という形で、後ろは動詞の原形。spending のような -ing形は続けられず、意味も合わない。",
"148":"【正解 C：neither】A perhaps は「おそらく」。例：Perhaps he is busy（おそらく彼は忙しい）。推測を表す副詞で、「弁護士たちも合意できなかった」という否定への同意にはならない。／B meanwhile は「その間に・一方そのころ」。例：Meanwhile, the lawyers waited（その間、弁護士たちは待った）。時間や対比をつなぐ語で、前の否定文を受ける表現ではない。／C neither は「〜もまた…ない」。前が could not agree なので、Neither could the lawyers.（弁護士たちも合意できなかった）となる。neither を文頭に置くと、助動詞 could が主語 the lawyers より前に出る語順になるので正解。／D rather は「むしろ・かなり」。例：rather than wait（待つよりむしろ）。選択や程度を表す語で、否定文への同意を表せない。",
"149":"【正解 C：verified】A verifying は「確認している」という -ing形。例：The specialist is verifying the references（担当者が推薦照会先を確認している）。今回は references が確認される側なので、能動の形では合わない。／B verifies は「確認する」という三人称単数形。例：She verifies the information（彼女は情報を確認する）。主語が references で、さらに must be の後ろに置く形でもない。／C verified は「確認された」という過去分詞。must be + 過去分詞で受動態（〜されなければならない）を作る。references must be verified（推薦照会先は確認されなければならない）となるので正解。／D verification は「確認・検証」という名詞。例：identity verification（本人確認）。must be の後ろにはこの文では動詞の過去分詞が必要なので、名詞は置けない。",
"150":"【正解 D：abruptly】A hardly は「ほとんど〜ない」。例：hardly ever（めったに〜ない）。頻度や程度を表す語で、「会議を突然終えた」という意味にはならない。／B widely は「広く」。例：widely known（広く知られている）。知名度や広がりを表す副詞で、会議を終える動作の仕方には合わない。／C immensely は「非常に・莫大に」。例：immensely popular（非常に人気がある）。程度を強める副詞で、ended（終えた）を「突然」という意味に修飾できない。／D abruptly は「突然・唐突に」。例：end a meeting abruptly（会議を突然終える）。ended を説明し、顧客に挨拶するため会議を急に切り上げた、という意味になるので正解。",

function showSelectionAdd(){
 const sel=window.getSelection();
 if(!sel||sel.isCollapsed){hideSelectionAdd();return}

 const node=sel.anchorNode;
 const selectedNode=node&&(node.nodeType===1?node:node.parentElement);
 const allowed=['question','choices','feedback'].some(id=>$(id).contains(selectedNode));
 if(!text||!selectedNode||!allowed){hideSelectionAdd();return}

 if(!rect.width&&!rect.height){hideSelectionAdd();return}

}

 }catch(error){translated=''}
 selectionAddButton.disabled=false;
 selectionAddButton.textContent='📚 単語テストに追加';

let howlMissed=new Set(JSON.parse(localStorage.getItem('toeic_howl_missed')||'[]'));
let vocabMissed=new Set(JSON.parse(localStorage.getItem('toeic_vocab_missed')||'[]'));
function formatStudyMinutes(ms){let mins=Math.floor(ms/60000),hours=Math.floor(mins/60),remain=mins%60;return hours?hours+'時間'+remain+'分':mins+'分'}function formatStudyAverageSeconds(ms){return Math.round(ms/1000)+'秒'}
function syncStudyDate(){let key=studyDateKey();if(key!==activeStudyDate){activeStudyDate=key;todayStudyMs=Number(localStorage.getItem(key)||0)}}
function stopStudyTimer(){if(studyStartedAt){let elapsed=Date.now()-studyStartedAt;syncStudyDate();todayStudyMs+=elapsed;totalStudyMs+=elapsed;averageStudyMs+=elapsed;studyStartedAt=0;localStorage.setItem(activeStudyDate,String(todayStudyMs));localStorage.setItem('toeic_total_study_ms',String(totalStudyMs));localStorage.setItem('toeic_average_study_ms',String(averageStudyMs))}if(studyInterval){clearInterval(studyInterval);studyInterval=null}updateStudyTimer()}
function updateStudyTimer(){syncStudyDate();let active=studyStartedAt?Date.now()-studyStartedAt:0;let today=todayStudyMs+active,total=totalStudyMs+active,averageMs=answeredCount?(averageStudyMs+active)/answeredCount:0,average=answeredCount?formatStudyAverageSeconds(averageMs):'--',averageColor=!answeredCount||!timerEnabled?'':(averageMs/1000<=timerSeconds?'#16a06b':'#df5c62');$('timer').innerHTML='⏱ 1問あたり（平均）：<span id="averageStudyTime" style="color:'+averageColor+';font-weight:700">'+average+'</span>　｜　今日累積：'+formatStudyMinutes(today)+'　｜　合計累積：'+formatStudyMinutes(total)}
function startStudyTimer(){if(!questionTimerPaused&&!studyStartedAt&&!document.hidden){studyStartedAt=Date.now();studyInterval=setInterval(updateStudyTimer,1000)}updateStudyTimer()}
function recordAnsweredQuestion(){answeredCount++;localStorage.setItem('toeic_answered_count',String(answeredCount));updateStudyTimer()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopStudyTimer();else if(order.length&&idx<order.length&&!questionTimerPaused)startStudyTimer()});
window.addEventListener('pagehide',()=>stopStudyTimer());
updateStudyTimer();
function playPiko(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();[0,1].forEach(n=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=n?1320:990;g.gain.setValueAtTime(.0001,ctx.currentTime+n*.085);g.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+n*.085+.012);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+n*.085+.13);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+n*.085);o.stop(ctx.currentTime+n*.085+.14)});setTimeout(()=>ctx.close(),400)}catch(e){}}
function updateGoal(){let source=section==='grammar'?raw:(section==='howl'?howlPhrases:vocab),total=source.length,arch=archived[section].size,left=total-arch;$('goal').textContent='🎯 未アーカイブ '+left+' / '+total+' 問　｜　アーカイブ '+arch+' 問'+(left===0?'　全問制覇！':'');$('goalBar').style.width=(total?arch/total*100:0)+'%';$('archiveList').textContent='📦 アーカイブ ('+arch+')';$('all').textContent='全問題 ('+left+')';$('retry').textContent='間違えた問題 ('+(section==='grammar'?missed.size:section==='howl'?howlMissed.size:vocabMissed.size)+')';$('favorites').textContent='⭐ お気に入り ('+favorites[section].size+')'}
function start(m){mode=m;let source=section==='grammar'?raw:(section==='howl'?howlPhrases:vocab);order=source.map((_,i)=>i).filter(i=>m==='archive'?archived[section].has(favId(i)):!archived[section].has(favId(i))&&(m==='all'||(m==='favorites'?favorites[section].has(favId(i)):(section==='grammar'?missed.has(raw[i][0]):section==='howl'?howlMissed.has(i):vocabMissed.has(i)))));order.sort(()=>Math.random()-.5);idx=0;score=0;saveQuizProgress();updateGoal();if(order.length)startStudyTimer();render()}
function render(){answered=false;saveQuizProgress();$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('choices').innerHTML='';refreshStar();updateGoal();$('archiveCurrent').classList.toggle('hidden',mode==='archive');$('restoreCurrent').classList.toggle('hidden',mode!=='archive');if(idx>=order.length){stopQuestionTimer();$('questionTimer').classList.add('hidden');$('question').textContent=order.length?'終了！ '+score+' 問正解':(mode==='archive'?'📦 アーカイブは空です！':'🎉 対象の問題はありません！');$('count').textContent='完了';$('score').textContent='';$('bar').style.width='100%';stopStudyTimer();$('newBadge').classList.add('hidden');$('star').classList.add('hidden');$('archiveCurrent').classList.add('hidden');$('restoreCurrent').classList.add('hidden');return}let id=favId(order[idx]),isNew=!seen[section].has(id);if(isNew){seen[section].add(id);persistSet('toeic_seen_'+section,seen[section])}$('newBadge').classList.toggle('hidden',!isNew);updateStudyTimer();if(section!=='grammar'){stopQuestionTimer();$('questionTimer').classList.add('hidden');renderVocab();return}let q=raw[order[idx]];$('count').textContent=(idx+1)+' / '+order.length+' 問（No.'+q[0]+(mode==='archive'?'・アーカイブ':'')+'）';$('score').textContent='正解 '+score;$('bar').style.width=(idx/order.length*100)+'%';$('question').textContent=q[1];q[2].forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent='('+String.fromCharCode(65+i)+') '+v;b.onclick=()=>answer(i);$('choices').append(b)});startQuestionTimer()}
function scrollToCurrentQuestion(){requestAnimationFrame(()=>{const q=$('question');if(q){const target=Math.max(0,window.scrollY+q.getBoundingClientRect().top-64);window.scrollTo({top:target,behavior:'smooth'})}})}function archiveCurrent(){if(idx>=order.length||mode==='archive')return;let id=favId(order[idx]);archived[section].add(id);persistSet('toeic_archived_'+section,archived[section]);playPiko();order.splice(idx,1);updateGoal();render();scrollToCurrentQuestion()}
function restoreCurrent(){if(idx>=order.length||mode!=='archive')return;let id=favId(order[idx]);archived[section].delete(id);persistSet('toeic_archived_'+section,archived[section]);playPiko();order.splice(idx,1);updateGoal();render()}function answer(i){if(section!=='grammar'){answerVocab(i);return}if(answered)return;answered=true;const responseElapsed=(questionTimerElapsedMs+(questionTimerStartedAt?Date.now()-questionTimerStartedAt:0))/1000;stopQuestionTimer(true);recordAnsweredQuestion();let q=raw[order[idx]],ok=i===q[3];playAnswerSound(ok,responseElapsed,ok&&timerEnabled&&responseElapsed!==null&&responseElapsed<=timerSeconds/2);if(ok){score++;missed.delete(q[0])}else missed.add(q[0]);updateStudyTimer();localStorage.setItem('toeic_missed',JSON.stringify([...missed]));saveQuizProgress();[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('score').textContent=`正解 ${score}`;$('feedback').innerHTML=`<b>${ok?'✅ 正解！':'❌ 不正解'}　正解：(${String.fromCharCode(65+q[3])}) ${q[2][q[3]]}</b><br><br><b>日本語訳</b><br>${q[4]}<br><br><b>解説</b><br>${q[5]}<br><br><b>🔍 消去法・選び方</b><br>${strategyTips[q[0]]}`;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('next').textContent=idx===order.length-1?'結果を見る →':'次の問題 →'}$('next').onclick=()=>{idx++;render();scrollToCurrentQuestion()};$('askChatGPT').onclick=askChatGPT;$('retry').onclick=()=>start('wrong');$('all').onclick=()=>start('all');$('favorites').onclick=()=>start('favorites');$('archiveList').onclick=()=>start('archive');$('archiveCurrent').onclick=archiveCurrent;$('restoreCurrent').onclick=restoreCurrent;$('star').onclick=()=>{if(idx>=order.length)return;let id=favId(order[idx]),set=favorites[section];if(set.has(id))set.delete(id);else set.add(id);localStorage.setItem('toeic_fav_'+section,JSON.stringify([...set]));refreshStar()};function setSection(s){if(section!==s)saveQuizProgress();section=s;$('grammarTab').classList.toggle('active',s==='grammar');$('vocabTab').classList.toggle('active',s==='vocab');$('howlTab').classList.toggle('active',s==='howl');$('kind').textContent=s==='grammar'?'英文の空欄に入る語を選ぼう':s==='howl'?'ハウルの英会話フレーズを覚えよう':'英単語の日本語の意味を選ぼう（50語）';if(!restoreQuizProgress(s))start('all')} $('grammarTab').onclick=()=>setSection('grammar');$('vocabTab').onclick=()=>setSection('vocab');$('howlTab').onclick=()=>setSection('howl');
function speakVocabWord(word){if(!('speechSynthesis' in window)||!window.SpeechSynthesisUtterance)return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word);utterance.lang='en-US';utterance.rate=0.88;const voices=window.speechSynthesis.getVoices();const englishVoice=voices.find(v=>/^en-US$/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(englishVoice)utterance.voice=englishVoice;window.speechSynthesis.speak(utterance)}
function renderVocab(){let source=section==='howl'?howlPhrases:vocab,n=order[idx],q=source[n],distractors=source.map((x,i)=>i).filter(i=>i!==n).sort(()=>Math.random()-.5).slice(0,3);vocabOptions=[n,...distractors].sort(()=>Math.random()-.5);$('count').textContent=(idx+1)+' / '+order.length+(section==='howl'?' フレーズ':' 語')+(mode==='archive'?'（アーカイブ）':'');$('score').textContent=`正解 ${score}`;$('bar').style.width=`${idx/order.length*100}%`;const questionEl=$('question');questionEl.textContent=q[0];const oldSpeak=$('vocabSpeak');if(oldSpeak)oldSpeak.remove();if(section==='vocab'){const speak=document.createElement('button');speak.id='vocabSpeak';speak.type='button';speak.className='vocab-speak';speak.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.8v10.4L17 12 9 6.8Z" fill="currentColor"/></svg>';speak.title='単語の発音を聞く';speak.setAttribute('aria-label','単語の発音を聞く');speak.disabled=!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window);speak.onclick=(e)=>{e.stopPropagation();speakVocabWord(q[0])};questionEl.appendChild(speak);speakVocabWord(q[0])}vocabOptions.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`(${String.fromCharCode(65+i)}) ${source[v][1]}`;b.onclick=()=>answerVocab(i);$('choices').append(b)})}
function answerVocab(i){if(answered)return;answered=true;stopQuestionTimer(true);recordAnsweredQuestion();let n=order[idx],source=section==='howl'?howlPhrases:vocab,right=vocabOptions.indexOf(n),ok=i===right,missSet=section==='howl'?howlMissed:vocabMissed;playAnswerSound(ok,null,false);if(ok){score++;missSet.delete(n)}else missSet.add(n);updateStudyTimer();localStorage.setItem(section==='howl'?'toeic_howl_missed':'toeic_vocab_missed',JSON.stringify([...missSet]));saveQuizProgress();[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===right)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('score').textContent=`正解 ${score}`;$('feedback').textContent=`${ok?'✅ 正解！':'❌ 不正解'}　${source[n][0]} ＝ ${source[n][1]}`;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('next').textContent=idx===order.length-1?'結果を見る →':'次の問題 →'}if(!restoreQuizProgress())start('all');</script></html>
